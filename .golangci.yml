# golangci-lint v2 config for rundiff. Conservative, fast linters that catch real
# bugs and keep style consistent without fighting the developer.
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    - gosec
  settings:
    gosec:
      # Scope gosec to the exec/file-injection rules, matching the fleet
      # convention (cifail, prmap); the rest is noise for a single-binary CLI.
      # rundiff's whole job is executing the user's argv, so the one G204 site
      # in runner.go carries a justified `#nosec` and anything new must too.
      includes:
        - G204 # subprocess launched with a non-constant argument
        - G304 # file read from a non-constant path
    errcheck:
      # Writes to stdout/stderr via fmt.Fprint* in a CLI are best-effort (a
      # broken pipe is not actionable); don't require checking them.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # cobra RunE handlers have a fixed (cmd, args) signature; an unused one
        # is unavoidable, not a smell.
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      # tests may ignore errors freely, and test fixtures are not a security
      # boundary.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
